[workspace]
members = [
    "crates/freevideo-core",
    "crates/freevideo-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["FreeVideo Contributors"]
license = "Apache-2.0"
repository = "https://github.com/FlashML-org/FreeVideo"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1.10", features = ["v4", "fast-rng"] }
sysinfo = "0.31"
thiserror = "1.0"
safetensors = "0.4"
clap = { version = "4.5", features = ["derive", "env"] }
colored = "2.1"
anyhow = "1.0"
tempfile = "3.12"
